<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Litt Wallet</title>
    <meta name="description" content="A digital wallet prototype built on the litt design system." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c2ff4d'/%3E%3C/svg%3E"
    />
    <!-- Before paint: apply a saved theme choice. No choice means follow the OS. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var s = localStorage.getItem("wallet-theme");
          if (s === "light" || s === "dark") d.dataset.theme = s;
          if (!d.lang) d.lang = "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
